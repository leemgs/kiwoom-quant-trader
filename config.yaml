# KIS Quant Trader Configuration

auth:
  kis_app_key: ""             # .env 파일에서 KIS_APP_KEY 를 설정하세요
  kis_app_secret: ""          # .env 파일에서 KIS_APP_SECRET 를 설정하세요
  kis_account_no: ""          # .env 파일에서 KIS_ACCOUNT_NO 를 설정하세요
  kis_account_suffix: "01"    # 계좌부호 2자리 (보통 01, .env 오버라이드 가능)
  kis_virtual_trading: true   # 모의투자 여부 (true/false)
  telegram_token: ""          # .env 파일에서 TELEGRAM_TOKEN 을 설정하세요
  chat_id: ""                 # .env 파일에서 TELEGRAM_CHAT_ID 를 설정하세요
  gemini_api_key: ""          # .env 파일에서 GEMINI_API_KEY 를 설정하세요

trading:
  universe:
    - "005930" # 삼성전자
    - "000660" # SK하이닉스
    - "035420" # NAVER
    - "035720" # 카카오
  max_budget: 10000      # 극소액(1만원) 도전
  k_value: 0.4
  stop_loss: 0.015       # 1.5% 칼손절
  take_profit: 0.03      # 3% 1차 익절
  max_stocks: 1          # 소액 집중 투자
  extreme_growth:
    enable: true
    use_margin_leverage: true  # 미수/신용 최대치 사용
    smart_order_routing: true  # 지정가(Maker) 매매를 통한 수수료 방어
    micro_scalping_ticks: 3    # 호가 3틱 먹기 스캘핑
    limit_up_overnight: true   # 상한가 도달 시 오버나잇 허용
    kelly_criterion: true      # 승률에 따른 동적 비중 조절

logging:
  level: "INFO"
  file: "logs/trading.log"
