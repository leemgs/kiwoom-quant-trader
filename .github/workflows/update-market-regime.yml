name: Update Market Regime Data

# 시장 국면(지수 200일선) 데이터를 주기적으로 갱신하여 GitHub Pages 정적
# 대시보드(docs/regime.html)가 읽는 docs/data/market_regime.json 을 커밋한다.
# 야후 파이낸스 공개 데이터만 사용하므로 비밀키(Secrets)가 전혀 필요 없다.

on:
  schedule:
    # UTC 기준 2시간마다 실행 (200일선은 하루 단위로 변하므로 충분).
    # 참고: 예약 실행은 GitHub 부하에 따라 수 분~수십 분 지연될 수 있다(best-effort).
    - cron: '0 */2 * * *'
  workflow_dispatch: {}   # 수동 실행 버튼
  push:
    branches: [ main ]
    paths:
      - 'scripts/build_market_regime.py'
      - '.github/workflows/update-market-regime.yml'

permissions:
  contents: write   # 갱신된 JSON을 리포지토리에 커밋하기 위한 권한

concurrency:
  group: market-regime
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Build market regime JSON
        run: python scripts/build_market_regime.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/data/market_regime.json; then
            echo "변경 사항 없음 — 커밋 생략"
          else
            git add docs/data/market_regime.json
            git commit -m "chore(data): 시장 국면 데이터 자동 갱신 [skip ci]"
            git push
          fi
