services:
  bot:
    build: .
    container_name: quant_bot
    command: python main.py
    volumes:
      - .:/app
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul

  dashboard:
    build: .
    container_name: quant_dashboard
    command: >
      streamlit run src/monitor/dashboard.py
      --server.address=0.0.0.0
      --server.enableCORS=false
      --server.enableXsrfProtection=false
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
